<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;

}

body{

    font-family:'Montserrat',sans-serif;

    color:white;

    touch-action:manipulation;

}


/* =====================================================
   UNIVERSO PRINCIPAL
===================================================== */

#universe{

    position:fixed;

    inset:0;

    width:100vw;
    height:100vh;

    overflow:hidden;

    background:

        radial-gradient(
            ellipse at center,
            #18151d 0%,
            #0a090e 32%,
            #030305 67%,
            #000 100%
        );

}


/* =====================================================
   PROFUNDIDAD
===================================================== */

.space-depth{

    position:absolute;

    width:120%;
    height:120%;

    left:-10%;
    top:-10%;

    pointer-events:none;

    background:

        radial-gradient(
            circle at 20% 30%,
            rgba(204,157,61,.10),
            transparent 23%
        ),

        radial-gradient(
            circle at 82% 68%,
            rgba(104,61,145,.09),
            transparent 26%
        ),

        radial-gradient(
            circle at 50% 50%,
            rgba(255,196,78,.045),
            transparent 38%
        );

    animation:

        universeMove 25s
        ease-in-out
        infinite
        alternate;

}


@keyframes universeMove{

    0%{

        transform:
            scale(1)
            translate3d(0,0,0);

    }

    100%{

        transform:
            scale(1.12)
            translate3d(-2%,2%,0);

    }

}


/* =====================================================
   NEBULOSAS
===================================================== */

.nebula{

    position:absolute;

    border-radius:50%;

    pointer-events:none;

    filter:blur(110px);

}


.nebula.one{

    width:700px;
    height:500px;

    left:-280px;
    top:-180px;

    background:
        rgba(180,127,34,.13);

    transform:
        rotate(25deg);

}


.nebula.two{

    width:650px;
    height:550px;

    right:-250px;
    bottom:-220px;

    background:
        rgba(92,52,137,.11);

}


.nebula.three{

    width:450px;
    height:700px;

    left:38%;
    top:5%;

    background:
        rgba(214,161,49,.035);

    filter:blur(140px);

}


/* =====================================================
   POLVO ESTELAR
===================================================== */

.dust{

    position:absolute;

    inset:-20%;

    opacity:.48;

    pointer-events:none;

    background-image:

        radial-gradient(
            circle,
            rgba(255,255,255,.85)
            0 1px,
            transparent 1.5px
        );

    background-size:
        92px 79px;

    animation:
        dustMove
        45s
        linear
        infinite;

}


@keyframes dustMove{

    from{

        transform:
            translate3d(0,0,0);

    }

    to{

        transform:
            translate3d(-130px,90px,0);

    }

}


/* =====================================================
   ESTRELLAS PEQUEÑAS DEL UNIVERSO
===================================================== */

.background-star{

    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:#fff;

    opacity:.6;

    box-shadow:
        0 0 5px #fff;

    animation:
        backgroundTwinkle
        var(--duration)
        ease-in-out
        infinite
        alternate;

    pointer-events:none;

}


@keyframes backgroundTwinkle{

    0%{

        opacity:.15;

        transform:scale(.7);

    }

    100%{

        opacity:.9;

        transform:scale(1.5);

    }

}


/* =====================================================
   ÓRBITAS
===================================================== */

.orbit{

    position:absolute;

    left:50%;
    top:50%;

    width:520px;
    height:520px;

    border:
        1px solid
        rgba(211,165,68,.075);

    border-radius:50%;

    transform:
        translate(-50%,-50%)
        rotateX(65deg);

    animation:
        orbitRotation
        38s
        linear
        infinite;

    pointer-events:none;

}


.orbit.two{

    width:760px;
    height:760px;

    animation-duration:60s;

}


@keyframes orbitRotation{

    from{

        transform:
            translate(-50%,-50%)
            rotateX(65deg)
            rotateZ(0deg);

    }

    to{

        transform:
            translate(-50%,-50%)
            rotateX(65deg)
            rotateZ(360deg);

    }

}


/* =====================================================
   ESTRELLAS DE RECUERDOS
===================================================== */

.memory-star{

    position:absolute;

    width:13px;
    height:13px;

    border-radius:50%;

    cursor:pointer;

    z-index:30;

    background:

        radial-gradient(
            circle,
            #ffffff 0%,
            #fffce8 18%,
            #f5d884 38%,
            #d8a846 58%,
            rgba(213,163,58,.15) 76%,
            transparent 100%
        );

    box-shadow:

        0 0 5px #fff,

        0 0 12px #fff1ad,

        0 0 25px #e1b652,

        0 0 45px rgba(218,165,53,.75),

        0 0 75px rgba(213,158,43,.3);

    animation:

        starBreathing
        3s
        ease-in-out
        infinite
        alternate;

    transition:

        transform .35s ease,
        filter .35s ease;

}


.memory-star::before{

    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:65px;
    height:1px;

    transform:
        translate(-50%,-50%);

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,242,190,.85),
            transparent
        );

}


.memory-star::after{

    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:1px;
    height:65px;

    transform:
        translate(-50%,-50%);

    background:

        linear-gradient(
            180deg,
            transparent,
            rgba(255,242,190,.85),
            transparent
        );

}


.memory-star:hover{

    transform:scale(3);

    filter:brightness(1.8);

}


.memory-star:active{

    transform:scale(5);

    filter:brightness(3);

}


@keyframes starBreathing{

    0%{

        opacity:.65;

        box-shadow:

            0 0 5px #fff,

            0 0 12px #ffeeb0,

            0 0 25px #d9a847,

            0 0 45px rgba(213,160,45,.4);

    }

    100%{

        opacity:1;

        box-shadow:

            0 0 7px #fff,

            0 0 18px #fff5c7,

            0 0 38px #e8bb5c,

            0 0 70px rgba(219,168,55,.75);

    }

}


/* =====================================================
   EFECTO AL TOCAR
===================================================== */

.memory-star.flash{

    animation:
        starExplosion
        .8s
        ease
        forwards;

}


@keyframes starExplosion{

    0%{

        transform:scale(1);

    }

    30%{

        transform:scale(7);

        filter:brightness(4);

    }

    65%{

        transform:scale(3);

    }

    100%{

        transform:scale(1);

    }

}


/* =====================================================
   CENTRO
===================================================== */

.center{

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    z-index:10;

    pointer-events:none;

}


.center-content{

    width:90%;

    animation:
        centerAppear
        2.5s
        cubic-bezier(.16,1,.3,1);

}


@keyframes centerAppear{

    from{

        opacity:0;

        transform:
            scale(.7);

        filter:
            blur(20px);

    }

    to{

        opacity:1;

        transform:
            scale(1);

        filter:
            blur(0);

    }

}


.small-title{

    font-size:9px;

    letter-spacing:9px;

    color:#b99854;

    margin-bottom:20px;

}


h1{

    font-family:
        'Cormorant Garamond',
        serif;

    font-weight:300;

    font-size:
        clamp(55px,12vw,170px);

    letter-spacing:
        clamp(6px,2vw,22px);

    background:

        linear-gradient(
            110deg,
            #76551c,
            #d3aa58,
            #fff1b8,
            #c4943d,
            #76531a
        );

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;

    text-shadow:
        0 0 50px
        rgba(218,174,85,.12);

}


.subtitle{

    margin-top:15px;

    font-family:
        'Cormorant Garamond',
        serif;

    font-size:20px;

    color:#aaa;

    font-style:italic;

}


/* =====================================================
   INSTRUCCIÓN
===================================================== */

.explore{

    position:absolute;

    left:50%;
    bottom:42px;

    transform:
        translateX(-50%);

    z-index:50;

    text-align:center;

    color:#b9974f;

    font-size:9px;

    letter-spacing:4px;

    white-space:nowrap;

    animation:
        explorePulse
        3s
        ease-in-out
        infinite;

}


.explore-arrow{

    display:block;

    margin-top:10px;

    font-size:18px;

}


@keyframes explorePulse{

    0%,100%{

        opacity:.35;

    }

    50%{

        opacity:1;

    }

}


/* =====================================================
   CONTADOR
===================================================== */

.counter{

    position:absolute;

    left:30px;
    bottom:30px;

    z-index:50;

    font-size:8px;

    letter-spacing:3px;

    color:#777;

}


.counter strong{

    color:#d5af5c;

    font-weight:400;

}


/* =====================================================
   MODAL
===================================================== */

#modal{

    position:fixed;

    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:

        radial-gradient(
            circle at center,
            rgba(56,39,17,.20),
            rgba(0,0,0,.95)
        );

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    z-index:100;

}


#modal.show{

    display:flex;

    animation:
        modalAppear
        .45s
        ease;

}


@keyframes modalAppear{

    from{

        opacity:0;

    }

    to{

        opacity:1;

    }

}


/* =====================================================
   TARJETA
===================================================== */

.card{

    position:relative;

    width:
        min(850px,94vw);

    max-height:
        92vh;

    overflow-y:auto;

    background:

        linear-gradient(
            145deg,
            rgba(29,25,18,.98),
            rgba(4,4,7,.99)
        );

    border:
        1px solid
        rgba(221,174,76,.45);

    box-shadow:

        0 0 100px
        rgba(0,0,0,.95),

        0 0 70px
        rgba(205,155,49,.08);

    padding:10px;

    animation:
        cardAppear
        .65s
        cubic-bezier(.16,1,.3,1);

}


@keyframes cardAppear{

    from{

        opacity:0;

        transform:
            scale(.7)
            translateY(60px);

    }

    to{

        opacity:1;

        transform:
            scale(1)
            translateY(0);

    }

}


/* =====================================================
   FOTO
===================================================== */

.photo-container{

    position:relative;

    width:100%;

    height:auto;

    overflow:hidden;

    background:#050505;

}


.photo-container::after{

    content:"";

    position:absolute;

    inset:0;

    background:

        linear-gradient(
            to top,
            rgba(0,0,0,.65),
            transparent 50%
        );

    pointer-events:none;

}


#photo{

    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    transition:
        transform
        8s
        ease;

}


.card:hover #photo{

    transform:scale(1.04);

}


/* =====================================================
   INFORMACIÓN
===================================================== */

.info{

    padding:
        30px 35px 38px;

}


.date{

    color:#ae8c49;

    font-size:9px;

    letter-spacing:4px;

    margin-bottom:10px;

}


.title{

    font-family:
        'Cormorant Garamond',
        serif;

    color:#ead39b;

    font-size:46px;

    font-weight:400;

    margin-bottom:14px;

}


.text{

    max-width:700px;

    color:#999;

    font-size:13px;

    line-height:2;

}


/* =====================================================
   BOTÓN CERRAR
===================================================== */

.close{

    position:absolute;

    top:22px;
    right:22px;

    width:43px;
    height:43px;

    border:
        1px solid
        rgba(255,255,255,.25);

    border-radius:50%;

    background:
        rgba(0,0,0,.65);

    color:white;

    font-size:22px;

    line-height:40px;

    text-align:center;

    cursor:pointer;

    z-index:200;

    transition:
        .3s;

}


.close:hover{

    background:#d5ad5b;

    color:#000;

}


/* =====================================================
   ESTRELLA FUGAZ
===================================================== */

.shooting-star{

    position:absolute;

    width:180px;
    height:2px;

    background:

        linear-gradient(
            90deg,
            transparent,
            #fff,
            #e1b653
        );

    transform:
        rotate(-35deg);

    opacity:0;

    pointer-events:none;

    animation:
        shooting
        8s
        linear
        infinite;

}


@keyframes shooting{

    0%{

        opacity:0;

        transform:
            translate3d(0,0,0)
            rotate(-35deg);

    }

    3%{

        opacity:1;

    }

    12%{

        opacity:0;

        transform:
            translate3d(-600px,450px,0)
            rotate(-35deg);

    }

    100%{

        opacity:0;

    }

}

   TABLET
===================================================== */

    }

    }

@media(

</style>

function openMemory(star,id){

    star.classList.remove("flash");

    void star.offsetWidth;

    star.classList.add("flash");


    if(
        navigator.vibrate
    ){

        navigator.vibrate(
            [20,30,50]
        );

    }


    setTimeout(function(){

        const memory =
            memories[id];


        document
            .getElementById("date")
            .textContent =
            memory.date;


        document
            .getElementById("title")
            .textContent =
            memory.title;


        document
            .getElementById("text")
            .textContent =
            memory.text;


        const image =
            document.getElementById("photo");


        image.style.opacity="0";


        image.src =
            memory.image;


        image.onload =
            function(){

                image.style.opacity="1";

            };


        document
            .getElementById("modal")
            .classList.add("show");


        document.body.style.overflow =
            "hidden";


    },300);

}


/* =====================================================
   CERRAR RECUERDO
===================================================== */

function closeMemory(){

    document
        .getElementById("modal")
        .classList.remove("show");


    document.body.style.overflow =
        "hidden";

}


/* =====================================================
   CLICK FUERA DE LA TARJETA
===================================================== */

document
    .getElementById("modal")
    .addEventListener(
        "click",
        function(event){

            if(
                event.target === this
            ){

                closeMemory();

            }

        }
    );


/* =====================================================
   ESCAPE
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape"
        ){

            closeMemory();

        }

    }
);


/* =====================================================
   CONTADOR REGRESIVO
=====================================================

   FECHA DE REGRESO:
   7 DE OCTUBRE DE 2026

===================================================== */

const returnDate =
    new Date(
        "2026-10-07T00:00:00"
    );


function updateCounter(){

    const now =
        new Date();


    const difference =
        returnDate -
        now;


    /*
       Si ya llegó el día de regreso
    */

    if(
        difference <= 0
    ){

        document
            .getElementById("days")
            .textContent =
            "HOY ❤️";

        return;

    }


    /*
       Convertimos milisegundos
       a días completos
    */

    const days =
        Math.ceil(
            difference /
            (
                1000 *
                60 *
                60 *
                24
            )
        );


    document
        .getElementById("days")
        .textContent =
        days;

}


/*
   Ejecutar inmediatamente
*/

updateCounter();


/*
   Actualizar cada segundo
   para que el contador
   siempre esté correcto.
*/

setInterval(
    updateCounter,
    1000
);

/* =====================================================
   PARALLAX PARA PC
===================================================== */

let isTouch =
    false;


window.addEventListener(
    "touchstart",
    function(){

        isTouch=true;

    },
    {passive:true}
);


document.addEventListener(
    "mousemove",
    function(event){

        if(isTouch){

            return;

        }


        const x =
            (
                event.clientX /
                window.innerWidth
            ) - .5;


        const y =
            (
                event.clientY /
                window.innerHeight
            ) - .5;


        const dust =
            document.querySelector(
                ".dust"
            );


        const depth =
            document.querySelector(
                ".space-depth"
            );


        dust.style.transform =
            `translate3d(
                ${x*25}px,
                ${y*25}px,
                0
            )`;


        depth.style.transform =
            `translate3d(
                ${x*-15}px,
                ${y*-15}px,
                0
            )`;

    },
    {passive:true}
);


/* =====================================================
   MOVIMIENTO CON EL CELULAR
===================================================== */

window.addEventListener(
    "deviceorientation",
    function(event){

        if(
            !isTouch
        ){

            return;

        }


        const gamma =
            event.gamma || 0;


        const beta =
            event.beta || 0;


        const dust =
            document.querySelector(
                ".dust"
            );


        const depth =
            document.querySelector(
                ".space-depth"
            );


        dust.style.transform =
            `translate3d(
                ${gamma*1.5}px,
                ${beta*0.5}px,
                0
            )`;


        depth.style.transform =
            `translate3d(
                ${gamma*.7}px,
                ${beta*.3}px,
                0
            )`;

    },
    true
);


/* =====================================================
   EVITAR ZOOM ACCIDENTAL
===================================================== */

document.addEventListener(
    "gesturestart",
    function(event){

        event.preventDefault();

    }
);
